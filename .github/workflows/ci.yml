name: CI

# Roda em todo pull request e em todo push na main: instalação limpa, conferência de tipos e todas as suítes do servidor.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck e suítes do servidor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Conferir tipos (typecheck)
        run: npm run typecheck

      - name: Suítes do servidor
        run: npm run test:ci -w @frixep/server
